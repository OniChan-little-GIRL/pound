name: Android APK CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cmake_variant:
          - name: baseline
            args: "-DPOUND_STUB_LEVEL=1"
          - name: lto-off
            args: "-DPOUND_STUB_LEVEL=2 -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF"
          - name: linker-safe
            args: "-DPOUND_STUB_LEVEL=3 -DCMAKE_SHARED_LINKER_FLAGS=-Wl,--no-undefined"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;26.3.11579264"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK (${{ matrix.cmake_variant.name }})
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_cmakeVariantArgs: ${{ matrix.cmake_variant.args }}
        run: ./gradlew assembleDebug

      - name: Upload debug APK (${{ matrix.cmake_variant.name }})
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ matrix.cmake_variant.name }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
