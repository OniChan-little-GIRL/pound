name: Android CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
  pull_request:
    paths:
      - 'android/**'

jobs:
  build:
    name: Build APK (Matrix ${{ matrix.cmake_flags }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cmake_flags: ["", "-DPREVENT_DESKTOP_LEAK=ON", "-DNDK_OPTIMIZED_BUILD=ON"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & Tools
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Build with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -Pandroid.externalNativeBuild.cmake.arguments="${{ matrix.cmake_flags }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pound-emulator-debug-${{ strategy.job-index }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
